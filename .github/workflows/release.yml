name: Build & Release RBZ

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # нужно для создания GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # UI (Vue 3 + Tailwind) собирается перед упаковкой: результат кладётся
      # в dn1sup_autoselect_tag/html/ и попадает в .rbz на этапе pack.
      - name: Build UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Pack RBZ
        run: ruby tools/pack.rb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rbz
